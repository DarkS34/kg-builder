[project]
name = "kg-builder"
version = "0.1.0"
description = "Schema-guided knowledge graph extraction from documents, with a configurable relation vocabulary and local LLMs"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["knowledge-graph", "llm", "ollama", "information-extraction", "docling"]
dependencies = [
    "docling>=2.0.0",
    "httpx>=0.27.0",
    "json-repair>=0.59.5",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "ollama>=0.4.7",
    "tqdm>=4.67.3",
]

[project.scripts]
kg-builder = "kg_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kg_builder"]
